services:
  - name: resolvex-backend
    type: web
    git:
      repository: github.com/Maheshdevarakonda/ResolveX
      branch: main
    build:
      dockerfile: null
      build_command: cd backend && npm install && npm run build
      run_command: cd backend && npm start
    ports:
      - port: 8000
        protocol: http
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      # Set the following in Koyeb dashboard (keep secrets out of git)
      # MONGODB_URI
      # JWT_ACCESS_SECRET
      # JWT_REFRESH_SECRET
      # CLIENT_URL
    health_checks:
      - path: /api/v1/health
        port: 8000
        interval: 30
        timeout: 5
